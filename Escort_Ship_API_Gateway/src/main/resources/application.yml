server:
  port: 8080

spring:
  application:
    name: WhiteHeaven_API_Gateway

  cloud:
    gateway:
      routes:
        - id: user-microservice
          uri: lb://WhiteHeavenUserMicroservice
          predicates:
            - Path=/users/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

uri: lb://WhiteHeavenUserMicroservice