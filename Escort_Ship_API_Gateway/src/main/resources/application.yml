server:
  port: 8080

spring:
  application:
    name: EscortShip_API_Gateway

  cloud:
    gateway:
      routes:
        - id: user-microservice
          uri: lb://EscortShipUserMicroservice
          predicates:
            - Path=/users/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

uri: lb://EscortShipUserMicroservice